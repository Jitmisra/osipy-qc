[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osipy-qc"
version = "0.1.0"
description = "Quality Control ToolBox for ASL MRI — PASS/WARN/FAIL triage of CBF maps and raw data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Agnik Misra" }]
keywords = ["ASL", "MRI", "perfusion", "CBF", "quality-control", "QEI", "OSIPI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
osipy-qc = "osipy_qc.cli:main"

[project.urls]
Homepage = "https://github.com/Jitmisra/osipy-qc"
Repository = "https://github.com/Jitmisra/osipy-qc"
Issues = "https://github.com/Jitmisra/osipy-qc/issues"

[tool.setuptools.packages.find]
include = ["osipy_qc*"]

[tool.setuptools.package-data]
osipy_qc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
